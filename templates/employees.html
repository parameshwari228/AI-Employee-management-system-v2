<!DOCTYPE html>
<html>
<head>
<title>Employees</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
}

.container{
width:90%;
margin:30px auto;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

table,th,td{
border:1px solid #ccc;
}

th{
background:#007BFF;
color:white;
padding:12px;
}

td{
padding:10px;
text-align:center;
}

a{
text-decoration:none;
background:#007BFF;
color:white;
padding:8px 12px;
border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Employee List</h2>

<br>

<a href="{{ url_for('add_employee') }}">Add Employee</a>

<br><br>

<table>

<tr>
<th>ID</th>
<th>Employee ID</th>
<th>Name</th>
<th>Department</th>
<th>Designation</th>
<th>Email</th>
<th>Phone</th>
</tr>

{% for emp in employees %}

<tr>

<td>{{ emp.id }}</td>

<td>{{ emp.employee_id }}</td>

<td>{{ emp.name }}</td>

<td>{{ emp.department }}</td>

<td>{{ emp.designation }}</td>

<td>{{ emp.email }}</td>

<td>{{ emp.phone }}</td>
<td>
<a href="{{ url_for('delete_employee', id=emp.id) }}"
onclick="return confirm('Are you sure you want to delete this employee?')">
Delete
</a>
</td>


</tr>

{% endfor %}

</table>

</div>

</body>
</html>
