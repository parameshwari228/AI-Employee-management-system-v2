<!DOCTYPE html>
<html>
<head>

<title>Employee Feedback Sentiment Analysis</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
}

.container{
    width:600px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
    color:#2563eb;
}

textarea{
    width:100%;
    height:150px;
    padding:10px;
    font-size:16px;
    border:1px solid gray;
    border-radius:5px;
    resize:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.result{
    margin-top:25px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.positive{
    color:green;
}

.negative{
    color:red;
}

.neutral{
    color:orange;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#2563eb;
    font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h2>Employee Feedback Sentiment Analysis</h2>

<form method="POST">

<textarea
name="feedback"
placeholder="Enter employee feedback..."
required></textarea>

<button type="submit">
Analyze Feedback
</button>

</form>

{% if result %}

<div class="result">

{% if result=="Positive" %}

<p class="positive">
😊 Positive Feedback
</p>

{% elif result=="Negative" %}

<p class="negative">
😞 Negative Feedback
</p>

{% else %}

<p class="neutral">
😐 Neutral Feedback
</p>

{% endif %}

</div>

{% endif %}

<a href="{{ url_for('dashboard') }}" class="back">
⬅ Back to Dashboard
</a>

</div>

</body>
</html>
