<!DOCTYPE html>
<html>
<head>

<title>Employee Anomaly Detection</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
}

.container{
    width:90%;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#2563eb;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
    border:1px solid #ddd;
}

.anomaly{
    color:red;
    font-weight:bold;
}

.normal{
    color:green;
    font-weight:bold;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>


<body>

<div class="container">

<h2>🚨 Employee Anomaly Detection</h2>


<table>

<tr>

<th>Employee ID</th>
<th>Anomaly Score</th>
<th>Status</th>

</tr>


{% for row in data %}

<tr>

<td>
{{ row.Employee_ID }}
</td>


<td>
{{ "%.4f"|format(row.Anomaly_Score) }}
</td>


<td>

{% if row.Status == "Anomaly" %}

<span class="anomaly">
⚠️ {{ row.Status }}
</span>

{% else %}

<span class="normal">
✅ {{ row.Status }}
</span>

{% endif %}

</td>


</tr>

{% endfor %}


</table>


<a href="{{ url_for('dashboard') }}" class="btn">
⬅ Back to Dashboard
</a>


</div>

</body>

</html>
