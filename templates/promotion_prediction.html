<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Promotion Prediction</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f4f6f9;
}

.container{
width:500px;
margin:50px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#2563eb;
margin-bottom:25px;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input,select{
width:100%;
padding:10px;
margin-top:8px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:25px;
background:#2563eb;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.result{
margin-top:20px;
padding:15px;
background:#e8f5e9;
border-radius:5px;
text-align:center;
font-size:20px;
font-weight:bold;
color:green;
}

.back{
display:block;
margin-top:20px;
text-align:center;
background:#555;
color:white;
text-decoration:none;
padding:12px;
border-radius:5px;
}

.back:hover{
background:#333;
}

</style>

</head>

<body>

<div class="container">

<h2>Promotion Prediction</h2>

<form method="POST">

<label>Attendance (%)</label>
<input type="number" name="attendance" required>

<label>Experience (Years)</label>
<input type="number" name="experience" required>

<label>Projects Completed</label>
<input type="number" name="projects" required>

<label>Performance</label>

<select name="performance" required>
<option value="">Select</option>
<option value="Excellent">Excellent</option>
<option value="Good">Good</option>
<option value="Average">Average</option>
<option value="Poor">Poor</option>
</select>

<button type="submit">
Predict Promotion
</button>

</form>

{% if result %}

<div class="result">

{{ result }}

</div>

{% endif %}

<a href="{{ url_for('dashboard') }}" class="back">
⬅ Back to Dashboard
</a>

</div>

</body>
</html>
